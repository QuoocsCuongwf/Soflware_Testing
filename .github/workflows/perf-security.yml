name: Performance & Security (k6)

on:
  # Chạy bằng tay
  workflow_dispatch:

  # Nếu muốn tạo nhánh riêng để test:
  #push:
    #branches: [ "perf-security" ]

jobs:
  performance-k6:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: flogin_db
          MYSQL_USER: flogin
          MYSQL_PASSWORD: flogin123
          MYSQL_ROOT_PASSWORD: root123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Backend: build jar và chạy app để k6 bắn vào
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build backend JAR (skip unit tests)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/flogin_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: flogin
          SPRING_DATASOURCE_PASSWORD: flogin123
        run: mvn -B clean package -DskipTests

      - name: Start backend application
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/flogin_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: flogin
          SPRING_DATASOURCE_PASSWORD: flogin123
        run: |
          nohup java -jar target/*.jar > backend.log 2>&1 &
          sleep 30  # chờ app lên (sau này có thể đổi thành curl health-check)

      # Setup k6 (dùng official actions của Grafana)
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # ====== K6: Load test cho Login API ======
      # Bạn tạo file: k6/login-test.js
      # Trong đó định nghĩa scenarios cho 100 / 500 / 1000 VUs
      - name: Run k6 Login load test
        uses: grafana/run-k6-action@v1
        with:
          path: ./k6/login-test.js
        env:
          BASE_URL: http://localhost:8080

      # ====== K6: Load test cho Login API ======
      # Bạn tạo file: k6/performance.login.js
      - name: Run k6 Product load test
        uses: grafana/run-k6-action@v1
        with:  
          path: ./frontend/src/test/performance.login.js
        env:
          BASE_URL: http://localhost:8080

      # Lưu log backend & k6 (để phân tích kết quả)
      - name: Upload performance logs
        uses: actions/upload-artifact@v4
        with:
          name: performance-logs
          path: |
            backend/backend.log

  # ====== Khung cho SECURITY TESTS (sau này bạn có thể bổ sung) ======
