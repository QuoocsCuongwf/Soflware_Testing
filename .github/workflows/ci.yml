name: Complete CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  complete-ci:
    runs-on: ubuntu-latest

    # MySQL service cho backend test (giống docker-compose của bạn)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: flogin_db
          MYSQL_USER: flogin
          MYSQL_PASSWORD: flogin123
          MYSQL_ROOT_PASSWORD: root123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Matrix: hiện tại chỉ 1 version, sau này bạn chỉ cần thêm vào mảng
    strategy:
      matrix:
        java-version: [ '21' ]
        node-version: [ '20' ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ===== BACKEND (Java/Maven) =====
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Backend - run tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/flogin_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: flogin
          SPRING_DATASOURCE_PASSWORD: flogin123
        run: mvn -B clean test

      # ===== FRONTEND (React) =====
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend - unit tests with coverage
        working-directory: frontend
        run: npm test -- --watch=false --coverage

      - name: Frontend - build production
        working-directory: frontend
        run: CI=false npm run build

      # ===== Lưu artefact (để tải về hoặc dùng cho deploy sau này) =====
      - name: Upload build & coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-and-coverage
          path: |
            backend/target
            frontend/build
            frontend/coverage
